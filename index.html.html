<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>카카오톡 이모티콘 터치 그림판 LAYER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#222;overscroll-behavior:none}
.toolbar{position:sticky;top:0;z-index:30;background:#fff;padding:7px;box-shadow:0 2px 8px #0002}.row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:3px 0}
button,input{min-height:42px}button{border:1px solid #bbb;border-radius:10px;background:#fff;font-size:14px;font-weight:700;padding:6px 9px;touch-action:manipulation}
button.active{background:#ffe071;border-color:#d9ad00}.tool{min-width:65px}.swatch{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;border:3px solid #ddd}.swatch.active{outline:3px solid #ffd43b}
#black{background:#111}#red{background:#e53935}#blue{background:#1e66f5}#green{background:#23a455}#yellow{background:#ffca28}
input[type=color]{width:40px;height:40px;border:0}.rangebox{display:flex;align-items:center;gap:4px;background:#f5f5f5;border-radius:9px;padding:3px 7px;font-size:12px;font-weight:700}
input[type=range]{width:100px}.val{min-width:38px;text-align:right}
#workspace{display:flex;align-items:flex-start;justify-content:center;gap:10px;padding:10px}
#stageWrap{height:calc(100vh - 175px);overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;flex:1}
#stage{position:relative;display:inline-block;width:min(75vw,720px);aspect-ratio:1241/1754;transform-origin:top left;background:#fff;box-shadow:0 2px 12px #0002}
#bg,.paint{position:absolute;inset:0;width:100%;height:100%}#bg{pointer-events:none;user-select:none;-webkit-user-drag:none}.paint{touch-action:none;cursor:crosshair}
#panel{width:210px;background:#fff;border-radius:12px;padding:9px;box-shadow:0 2px 10px #0002;position:sticky;top:165px}
#panel h3{font-size:15px;margin:2px 0 8px}.layer{display:flex;align-items:center;gap:5px;border:1px solid #ddd;border-radius:9px;padding:6px;margin:5px 0;background:#fafafa}
.layer.active{border:2px solid #e3b400;background:#fff7ce}.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}.mini{padding:3px 6px;min-height:32px;font-size:13px}
.help{font-size:11px;color:#666;text-align:center}.save{background:#ffd34d}.danger{color:#b00020}
@media(max-width:800px){#workspace{display:block}#panel{position:relative;top:auto;width:min(94vw,720px);margin:8px auto}#stage{width:min(94vw,720px)}#stageWrap{height:62vh}}
</style></head><body>

<div class="row">

<button id="undo">↶</button><button id="redo">↷</button>
</div><div class="row">

<div id="panel"><h3>📚 레이어</h3>
<div class="row"><button id="addLayer">＋ 추가</button><button id="delLayer">－ 삭제</button></div>
<div class="row"><button id="upLayer">↑ 위로</button><button id="downLayer">↓ 아래로</button></div>
<div id="layerList"></div>
<div class="rangebox" style="margin-top:8px">레이어 투명도 <input id="layerOpacity" type="range" min="0" max="100" value="100"><span id="layerOpacityVal" class="val">100%</span></div>
</div></div>

<script>
const stage=document.getElementById('stage'),host=document.getElementById('canvasHost');
let layers=[],active=0,tool='pen',color='#111111',brushWidth=7,opacity=1,zoom=1,drawing=false,last=null,seq=1;
let undoStack=[],redoStack=[];
function newCanvas(name){
 let c=document.createElement('canvas');c.className='paint';c.dataset.name=name;host.appendChild(c);
 let L={canvas:c,name,visible:true,opacity:1};layers.push(L);resizeOne(c);bindCanvas(c);setActive(layers.length-1);return L;
}
function resizeOne(c){let w=stage.clientWidth,h=stage.clientHeight,dpr=Math.max(1,devicePixelRatio||1);if(c.width===Math.round(w*dpr)&&c.height===Math.round(h*dpr))return;
 let old=document.createElement('canvas');old.width=c.width;old.height=c.height;if(c.width)old.getContext('2d').drawImage(c,0,0);
 c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width='100%';c.style.height='100%';if(old.width)c.getContext('2d').drawImage(old,0,0,c.width,c.height)}
function activeL(){return layers[active]} function activeC(){return activeL().canvas}
function setActive(i){active=Math.max(0,Math.min(layers.length-1,i));layers.forEach((L,j)=>L.canvas.style.pointerEvents=j===active?'auto':'none');renderLayers()}
function renderLayers(){layerList.innerHTML='';[...layers].reverse().forEach((L,ri)=>{let i=layers.length-1-ri,d=document.createElement('div');d.className='layer'+(i===active?' active':'');
 let eye=document.createElement('button');eye.className='mini';eye.textContent=L.visible?'👁':'🚫';eye.onclick=e=>{e.stopPropagation();L.visible=!L.visible;L.canvas.style.display=L.visible?'block':'none';renderLayers()};
 let n=document.createElement('span');n.className='lname';n.textContent=L.name;d.append(eye,n);d.onclick=()=>setActive(i);d.ondblclick=()=>{let x=prompt('레이어 이름',L.name);if(x){L.name=x;renderLayers()}};layerList.appendChild(d)});
 layerOpacity.value=Math.round(activeL().opacity*100);layerOpacityVal.textContent=layerOpacity.value+'%'}
function state(){return layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,data:L.canvas.toDataURL()}))}
function snap(){undoStack.push(state());if(undoStack.length>20)undoStack.shift();redoStack=[]}
function restore(st){while(layers.length)host.removeChild(layers.pop().canvas);st.forEach(x=>{let L=newCanvas(x.name);L.visible=x.visible;L.opacity=x.opacity;L.canvas.style.opacity=x.opacity;L.canvas.style.display=x.visible?'block':'none';let im=new Image();im.onload=()=>L.canvas.getContext('2d').drawImage(im,0,0,L.canvas.width,L.canvas.height);im.src=x.data});setActive(layers.length-1)}
function pt(e,c){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height,pressure:e.pressure>0?e.pressure:.5}}
function settings(ctx,p,c){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.globalCompositeOperation='source-over';let w=brushWidth*(c.width/stage.clientWidth),a=opacity;
 if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';w*=2.2;a=1}if(tool==='marker'){w*=1.5;a*=.75}if(tool==='highlighter'){w*=3.2;a*=.28}if(tool==='brush'){w*=.65+1.2*p.pressure;a*=.9}ctx.lineWidth=w;ctx.globalAlpha=a}
function bindCanvas(c){c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);snap();drawing=true;last=pt(e,c);let x=c.getContext('2d');settings(x,last,c);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(last.x+.01,last.y+.01);x.stroke()};
 c.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=pt(e,c),x=c.getContext('2d');settings(x,p,c);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{drawing=false;last=null}}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool});
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.color});
custom.oninput=e=>color=e.target.value;widthCtl.oninput=e=>{brushWidth=+e.target.value;widthVal.textContent=brushWidth};opacityCtl.oninput=e=>{opacity=+e.target.value/100;opacityVal.textContent=e.target.value+'%'};
addLayer.onclick=()=>{snap();newCanvas('레이어 '+(++seq))};delLayer.onclick=()=>{if(layers.length<=1)return alert('레이어는 최소 1개가 필요해요.');snap();host.removeChild(activeC());layers.splice(active,1);setActive(Math.min(active,layers.length-1))};
upLayer.onclick=()=>{if(active>=layers.length-1)return;snap();let t=layers[active];layers[active]=layers[active+1];layers[active+1]=t;active++;layers.forEach(L=>host.appendChild(L.canvas));renderLayers()};
downLayer.onclick=()=>{if(active<=0)return;snap();let t=layers[active];layers[active]=layers[active-1];layers[active-1]=t;active--;layers.forEach(L=>host.appendChild(L.canvas));renderLayers()};
layerOpacity.oninput=e=>{activeL().opacity=+e.target.value/100;activeC().style.opacity=activeL().opacity;layerOpacityVal.textContent=e.target.value+'%'};
clearLayer.onclick=()=>{if(confirm('현재 레이어만 지울까요?')){snap();activeC().getContext('2d').clearRect(0,0,activeC().width,activeC().height)}};
undo.onclick=()=>{if(!undoStack.length)return;redoStack.push(state());restore(undoStack.pop())};redo.onclick=()=>{if(!redoStack.length)return;undoStack.push(state());restore(redoStack.pop())};
zoomIn.onclick=()=>setZoom(zoom+.25);zoomOut.onclick=()=>setZoom(zoom-.25);function setZoom(z){zoom=Math.max(1,Math.min(3,z));stage.style.transform=`scale(${zoom})`;stage.style.marginRight=((zoom-1)*stage.offsetWidth)+'px';stage.style.marginBottom=((zoom-1)*stage.offsetHeight)+'px'}
save.onclick=()=>{let out=document.createElement('canvas'),base=layers[0].canvas;out.width=base.width;out.height=base.height;let o=out.getContext('2d'),bg=document.getElementById('bg');o.fillStyle='white';o.fillRect(0,0,out.width,out.height);o.drawImage(bg,0,0,out.width,out.height);
 layers.forEach(L=>{if(L.visible){o.save();o.globalAlpha=L.opacity;o.drawImage(L.canvas,0,0,out.width,out.height);o.restore()}});let a=document.createElement('a');a.download='나의_카카오톡_이모티콘.png';a.href=out.toDataURL('image/png');a.click()};
